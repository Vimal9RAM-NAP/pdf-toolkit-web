<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF CONVERSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
   
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col font-space selection:bg-cyan-600 selection:text-white">

    
    <header class="w-full border-b border-zinc-800 bg-black/80 backdrop-blur px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="h-3 w-3 rounded-full bg-[#19a4db] animate-pulse"></span>
            <span class="font-bold tracking-tight text-lg text-white">PDF<span class="text-[#19a4db]">CONVERSE</span></span>
        </div>
        <span class="text-xs font-mono uppercase tracking-widest text-zinc-500">PDF CONVERSE v1</span>
    </header>

    
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
       
        <section class="lg:col-span-5 bg-zinc-950 border border-zinc-800/80 rounded-2xl p-6 shadow-2xl space-y-6">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white mb-1">PDF Toolkit</h1>
                <p class="text-xs text-zinc-400">Perform local PDF manipulations directly in browser memory.</p>
            </div>

           
            <div class="grid grid-cols-3 gap-2 p-1 bg-zinc-900 border border-zinc-800 rounded-xl text-xs font-mono">
                <button id="mode-merge-btn" onclick="switchMode('merge')" class="py-2 rounded-lg font-semibold text-white bg-[#004cd8] transition-all">Merge</button>
                <button id="mode-split-btn" onclick="switchMode('split')" class="py-2 rounded-lg font-semibold text-zinc-400 hover:text-white transition-all">Split</button>
                <button id="mode-delete-btn" onclick="switchMode('delete')" class="py-2 rounded-lg font-semibold text-zinc-400 hover:text-white transition-all">Delete Pages</button>
                <button id="mode-pdf2img-btn" onclick="switchMode('pdf2img')" class="py-2 rounded-lg font-semibold text-zinc-400 hover:text-white transition-all">PDF to IMG</button>
                <button id="mode-pdf2ppt-btn" onclick="switchMode('pdf2ppt')" class="py-2 rounded-lg font-semibold text-zinc-400 hover:text-white transition-all">PDF to PPT</button>
                <button id="mode-img2pdf-btn" onclick="switchMode('img2pdf')" class="py-2 rounded-lg font-semibold text-zinc-400 hover:text-white transition-all">IMG to PDF</button>
            </div>

           
            <div id="drop-zone" class="border border-dashed border-zinc-700/80 rounded-xl p-6 text-center hover:border-[#19a4db]/80 bg-zinc-900/40 transition-all cursor-pointer group">
                <input type="file" id="file-input" multiple accept="application/pdf" class="hidden">
                <label for="file-input" class="cursor-pointer block">
                    <div class="w-10 h-10 mx-auto mb-3 text-zinc-400 group-hover:text-[#19a4db] transition-colors">
                        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    </div>
                    <span id="file-label" class="text-sm text-zinc-300 font-medium block">Select PDF files to process</span>
                    <span id="file-sublabel" class="text-[10px] text-zinc-500 font-mono mt-1 block">Select 2 or more PDFs</span>
                </label>
            </div>

            
            <div id="split-controls" class="hidden space-y-4 pt-2">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400 mb-2">Start Page</label>
                        <input type="number" id="split-start" min="1" value="1" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-[#19a4db] font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400 mb-2">End Page</label>
                        <input type="number" id="split-end" min="1" value="1" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-[#19a4db] font-mono">
                    </div>
                </div>
            </div>

            
            <button id="process-btn" onclick="executePDFOperation()" class="w-full bg-[#004cd8] hover:bg-[#19a4db] text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-[#004cd8]/20 transition-all text-sm tracking-wide flex items-center justify-center space-x-2">
                <span id="btn-text">Execute Operation</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
            </button>
        </section>

     
        <section class="lg:col-span-7 bg-zinc-950 border border-zinc-800/80 rounded-2xl p-6 min-h-[460px] flex flex-col justify-between">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-4 mb-4">
                <span class="text-xs font-mono uppercase tracking-wider text-zinc-400">Live Preview Canvas</span>
                <span id="meta-count" class="hidden text-xs font-mono px-2.5 py-1 bg-zinc-900 border border-zinc-800 rounded text-[#19a4db]">0 Pages Loaded</span>
            </div>

            <div id="preview-stage" class="flex-1 border border-zinc-900 rounded-xl bg-black/60 p-4 relative overflow-y-auto max-h-[400px]">
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center space-y-2 py-12">
                    <div class="w-12 h-12 text-zinc-700">
                        <svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5-3h7.5M6 20.25h12A2.25 2.25 0 0020.25 18V6.75A2.25 2.25 0 0018 4.5H6A2.25 2.25 0 003.75 6.75v11.25A2.25 2.25 0 006 20.25z"/></svg>
                    </div>
                    <p class="text-xs text-zinc-500 font-mono">No active document rendering</p>
                </div>
                <div id="page-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
            </div>
        </section>

    </main>

    <script src="static/js/main.js"></script>
    <script src="static/js/pdf-ops.js"></script>
</body>
</html>
